name: Feature request
description: Suggest a TaxCode improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want.
    validations:
      required: true
  - type: checkboxes
    id: editions
    attributes:
      label: Affected editions
      options:
        - label: TaxCodePlugins
        - label: TaxCodeNoTelemetry
        - label: TaxCodeLite
        - label: TaxCodeVDS
  - type: dropdown
    id: privacy
    attributes:
      label: Does this require telemetry, analytics, or background network calls?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
